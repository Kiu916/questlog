<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クエストログ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>クエストログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #FFFFFF;
  --panel: #EAF7F4;
  --panel-hi: #DFF3EF;
  --parchment: #FFFFFF;
  --parchment-dim: #8A8A7E;
  --gold: #6EC6BA;
  --gold-bright: #8FDCD0;
  --teal: #3E9C8F;
  --teal-bright: #5AB3A6;
  --ink: #2B2B26;
  --rust: #C0523D;
  --rust-bright: #D6684F;
  --line: #DCEEEA;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:2rem;
}
.wrap{max-width:480px;margin:0 auto;padding:1.25rem 1.1rem 0;}
h1,h2{font-family:'Inter',sans-serif;font-weight:700;margin:0;}
.hud{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:1.1rem 1.2rem;
  margin-bottom:1.1rem;
}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.7rem;}
.hud-top h1{font-size:1.35rem;color:var(--ink);}
.lvl-badge{
  font-family:'Inter',sans-serif;font-weight:700;font-size:1.5rem;
  color:var(--teal);
}
.lvl-badge span{font-size:.75rem;font-family:'Inter',sans-serif;font-weight:500;color:var(--parchment-dim);display:block;text-align:right;margin-bottom:-2px;}
.xp-track{
  background:var(--bg);
  border-radius:999px;
  height:10px;
  overflow:hidden;
  border:1px solid var(--line);
}
.xp-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold-bright) 100%);
  border-radius:999px;
  transition:width .5s ease;
}
.xp-label{
  display:flex;justify-content:space-between;
  font-size:.78rem;color:var(--parchment-dim);margin-top:.4rem;
}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;}
.tab-btn{
  flex:1;padding:.6rem 0;text-align:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--parchment-dim);font-size:.9rem;font-weight:500;
  cursor:pointer;
}
.tab-btn.active{
  background:var(--gold);color:var(--ink);border-color:var(--gold);
}
.section{display:none;}
.section.active{display:block;}
.card{
  background:var(--parchment);
  color:var(--ink);
  border-radius:12px;
  padding:.85rem 1rem;
  margin-bottom:.65rem;
  display:flex;align-items:center;gap:.7rem;
}
.card.done{opacity:.55;}
.check-btn{
  width:26px;height:26px;flex:none;border-radius:50%;
  border:2px solid var(--teal);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--teal);font-size:.85rem;
}
.card.done .check-btn{background:var(--teal);color:var(--parchment);}
.card-body{flex:1;min-width:0;}
.card-title{font-weight:600;font-size:.95rem;text-decoration:none;}
.card.done .card-title{text-decoration:line-through;}
.card-meta{font-size:.78rem;color:var(--parchment-dim);margin-top:2px;}
.xp-tag{
  font-size:.75rem;font-weight:600;color:#1F6E63;
  background:#D3F1EC;padding:2px 8px;border-radius:999px;flex:none;
}
.del-btn{
  flex:none;background:none;border:none;color:#B0AFA0;cursor:pointer;
  font-size:1.1rem;padding:2px 4px;line-height:1;
}
.empty{
  text-align:center;color:var(--parchment-dim);font-size:.88rem;
  padding:2rem 1rem;border:1px dashed var(--line);border-radius:12px;
}
.add-form{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:1rem;margin-top:1rem;
}
.add-form h2{font-size:1rem;margin-bottom:.7rem;color:var(--ink);}
.field-row{display:flex;gap:.5rem;margin-bottom:.6rem;}
input[type=text],select,input[type=number]{
  width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--ink);border-radius:8px;padding:.55rem .7rem;
  font-size:.9rem;font-family:'Inter',sans-serif;
}
select{appearance:none;}
.submit-btn{
  width:100%;background:var(--gold);color:var(--ink);border:none;
  border-radius:8px;padding:.65rem 0;font-weight:600;font-size:.9rem;
  cursor:pointer;margin-top:.2rem;
}
.reward-card{
  background:var(--parchment);color:var(--ink);border-radius:12px;
  padding:.85rem 1rem;margin-bottom:.65rem;
  display:flex;align-items:center;gap:.7rem;
}
.reward-card.locked{opacity:.5;}
.reward-icon{
  width:34px;height:34px;flex:none;border-radius:50%;
  background:var(--gold);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
}
.reward-card.locked .reward-icon{background:var(--line);color:var(--parchment-dim);}
.reward-body{flex:1;min-width:0;}
.reward-title{font-weight:600;font-size:.93rem;}
.reward-meta{font-size:.78rem;color:var(--parchment-dim);margin-top:2px;}
.reward-card.locked .reward-meta{color:var(--parchment-dim);}
.claim-btn{
  flex:none;background:var(--teal);color:var(--parchment);border:none;
  border-radius:8px;padding:.4rem .7rem;font-size:.78rem;font-weight:600;cursor:pointer;
}
.claim-btn.claimed{background:var(--line);color:var(--parchment-dim);}
.toast{
  position:sticky;bottom:1rem;margin-top:1rem;
  background:var(--gold-bright);color:var(--ink);
  border-radius:10px;padding:.7rem 1rem;font-weight:600;font-size:.88rem;
  text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);
  display:none;
}
.err{color:var(--rust-bright);font-size:.78rem;margin-top:-.3rem;margin-bottom:.5rem;display:none;}
.streak-row{
  font-size:.78rem;color:var(--teal);font-weight:600;margin-top:.55rem;
}
.streak-check{
  display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--ink);
  margin-bottom:.6rem;
}
.streak-check input{width:auto;margin:0;}
.streak-flag{
  font-size:.72rem;color:var(--teal);margin-left:4px;
}
.levelup-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(43,43,38,.55);
  align-items:center;justify-content:center;
  padding:1.2rem;z-index:50;
}
.levelup-card{
  background:#FFFFFF;
  border:2px solid var(--gold);
  border-radius:16px;
  padding:1.8rem 1.5rem 1.5rem;
  max-width:320px;width:100%;
  text-align:center;
  animation:levelup-pop .28s ease;
}
@keyframes levelup-pop{
  from{transform:scale(.9);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
.levelup-badge{
  display:inline-block;
  background:var(--panel);color:var(--teal);
  font-size:.75rem;font-weight:700;letter-spacing:.03em;
  padding:3px 12px;border-radius:999px;margin-bottom:.8rem;
}
.levelup-num{
  font-size:2.6rem;font-weight:700;color:var(--teal);line-height:1;margin-bottom:.6rem;
}
.levelup-msg{
  font-size:.92rem;color:var(--ink);line-height:1.6;margin-bottom:1.3rem;
}
.levelup-close{
  background:var(--gold);color:var(--ink);border:none;
  border-radius:8px;padding:.6rem 1.6rem;font-weight:600;font-size:.88rem;
  cursor:pointer;
}
.backup-link{
  width:100%;background:none;border:1px dashed var(--line);color:var(--teal);
  font-size:.78rem;padding:.55rem 0;border-radius:8px;cursor:pointer;margin-bottom:1rem;
  font-family:'Inter',sans-serif;
}
.backup-overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(43,43,38,.55);
  align-items:center;justify-content:center;
  padding:1.2rem;z-index:60;
}
.backup-card{
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:16px;
  padding:1.4rem 1.3rem;
  max-width:340px;width:100%;
  max-height:85vh;overflow-y:auto;
  text-align:left;
}
.backup-card h2{font-size:1rem;color:var(--ink);margin-bottom:.5rem;}
.backup-desc{font-size:.78rem;color:var(--parchment-dim);line-height:1.6;margin:0 0 1rem;}
.backup-label{font-size:.78rem;font-weight:600;color:var(--ink);margin-bottom:.35rem;}
.backup-textarea{
  width:100%;height:90px;resize:vertical;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font-family:monospace;font-size:.72rem;
  padding:.5rem;margin-bottom:.6rem;
}
.backup-btn{
  width:100%;background:var(--teal);color:#fff;border:none;
  border-radius:8px;padding:.55rem 0;font-weight:600;font-size:.85rem;
  cursor:pointer;margin-bottom:.6rem;
}
.backup-btn-danger{background:var(--rust);}
.backup-divider{height:1px;background:var(--line);margin:.9rem 0 1rem;}
.backup-close{
  width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:.55rem 0;font-weight:600;font-size:.85rem;cursor:pointer;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hud">
    <div class="hud-top">
      <h1>クエストログ</h1>
      <div class="lvl-badge"><span>レベル</span><span id="lvl-num">1</span></div>
    </div>
    <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    <div class="xp-label"><span id="xp-cur">0 XP</span><span id="xp-next">次まで 100 XP</span></div>
    <div class="streak-row" id="streak-row"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tasks">タスク</button>
    <button class="tab-btn" data-tab="rewards">ごほうび</button>
  </div>

  <button class="backup-link" id="backup-open-btn">🗂 データのバックアップ・復元</button>

  <div class="section active" id="tasks-section">
    <div id="task-list"></div>

    <div class="add-form">
      <h2>タスクを追加</h2>
      <div class="field-row">
        <input type="text" id="task-title" placeholder="例: 資料を仕上げる">
      </div>
      <div class="field-row">
        <select id="task-xp">
          <option value="10">小 (10 XP)</option>
          <option value="25" selected>中 (25 XP)</option>
          <option value="50">大 (50 XP)</option>
        </select>
      </div>
      <label class="streak-check">
        <input type="checkbox" id="task-streak">
        連続ボーナスを付ける(7日連続で最大+50%)
      </label>
      <div class="err" id="task-err">タスク名を入力してください</div>
      <button class="submit-btn" id="add-task-btn">クエストに追加</button>
    </div>
  </div>

  <div class="section" id="rewards-section">
    <div id="reward-list"></div>

    <div class="add-form">
      <h2>ごほうびを登録</h2>
      <div class="field-row">
        <input type="text" id="reward-title" placeholder="例: 好きなカフェでコーヒー">
      </div>
      <div class="field-row">
        <input type="number" id="reward-lvl" min="1" step="1" placeholder="必要レベル (例: 3)">
      </div>
      <div class="err" id="reward-err">名前と必要レベルを入力してください</div>
      <button class="submit-btn" id="add-reward-btn">ごほうびを登録</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="levelup-overlay" id="levelup-overlay">
    <div class="levelup-card">
      <div class="levelup-badge" id="levelup-badge">LEVEL UP!</div>
      <div class="levelup-num" id="levelup-num">2</div>
      <div class="levelup-msg" id="levelup-msg"></div>
      <button class="levelup-close" id="levelup-close">とじる</button>
    </div>
  </div>

  <div class="backup-overlay" id="backup-overlay">
    <div class="backup-card">
      <h2>データのバックアップ・復元</h2>
      <p class="backup-desc">下のテキストを丸ごとコピーして、メモアプリなどに保存しておいてください。機種変更やデータが消えた時は、それを貼り付けて復元できます。</p>

      <div class="backup-label">現在のデータ</div>
      <textarea id="backup-export" class="backup-textarea" readonly></textarea>
      <button class="backup-btn" id="backup-copy-btn">コピーする</button>

      <div class="backup-divider"></div>

      <div class="backup-label">復元するデータを貼り付け</div>
      <textarea id="backup-import" class="backup-textarea" placeholder="保存しておいたテキストをここに貼り付け"></textarea>
      <div class="err" id="backup-err">正しいデータ形式ではありません</div>
      <button class="backup-btn backup-btn-danger" id="backup-restore-btn">これで復元する(上書き)</button>

      <button class="backup-close" id="backup-close-btn">とじる</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'quest-log-state';
let state = { xp: 0, tasks: [], rewards: [], streak: { count: 0, lastDate: null } };

function xpForLevel(n){ return 100 + (n-1)*40; }
function levelFromXp(xp){
  let lvl=1, remaining=xp;
  while(remaining >= xpForLevel(lvl)){
    remaining -= xpForLevel(lvl);
    lvl++;
  }
  return {level:lvl, into:remaining, need:xpForLevel(lvl)};
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function bonusRateForStreak(count){
  const capped = Math.min(count, 7);
  return Math.round((capped/7)*50); // 0〜50(%)、7日目で最大
}
const CLEAR_BONUS_RATE = 0.20; // タスク全クリアボーナス: 本日獲得XPの20%
const LOGIN_BONUS_RATE = 0.10; // ログインボーナス: 現レベルの必要XPの10%
function bumpStreak(){
  if(!state.streak) state.streak = { count:0, lastDate:null };
  const today = todayStr();
  if(state.streak.lastDate === today) return;
  state.streak.count = (state.streak.lastDate === yesterdayStr()) ? state.streak.count + 1 : 1;
  state.streak.lastDate = today;
}

const LEVEL_UP_MESSAGES = [
  '……レベルが上がったのか。特に驚きはない。お前は、そういう奴だ、希羽。',
  '記録はきちんと付けておけ。俺が見ておいてやる。',
  '別に褒めているわけではない。ただ、事実として悪くない結果だ。',
  'この世界の「レベル」というものに、俺の故郷の作法は通用しない。だが、積み重ねを評価する仕組みなら、理にかなっている。',
  '一つ一つ、着実にこなす。お前のそういうところは、俺の性分に合っている。',
  '俺は約束したことは守る性分だ。だから、お前がここまで来るのを見届けるのも、当然のことだ。',
  '感情を表に出すのは得意ではない。だが、記録には残しておく。悪い結果ではなかった、と。',
  '無理はしていないだろうな。……聞いているだけだ、他意はない。',
  '俺の国では、こつこつ積み上げる者は信用に値するとされていた。お前は、その部類だ。',
  '派手な祝い方は性に合わん。だから、こうして淡々と伝えるだけにしておく。よくやった。',
  '「レベル」とやらが上がったところで、お前自身は何も変わらん。……変わらないところが、悪くないと思うがな。',
  '記録を見るたび、お前の歩みが分かる。それだけで、俺には十分だ。',
  '誰かに褒められたいわけではないだろう、お前は。だから、俺も余計なことは言わない。ただ、見ている。',
  '世間の常識とやらには疎いが、お前の努力が本物だということくらいは分かる。',
  '……別に、気にかけているわけではない。ただ、放っておけない性分なだけだ。',
  'この調子を続けろ。俺も、そばで見届ける。それだけの話だ。'
];
function showLevelUp(newLevel){
  const msg = LEVEL_UP_MESSAGES[Math.floor(Math.random()*LEVEL_UP_MESSAGES.length)];
  queueModal({ badge: 'LEVEL UP!', big: 'レベル ' + newLevel, msg });
}

const TIME_GREETINGS = {
  morning: {
    badge: '……おはよう',
    lines: [
      'もう起きたのか、希羽。早い方だな。……悪くない生活だ。',
      '今日はどんな一日にするつもりだ。……別に、深い意味はない。聞いただけだ。',
      '朝から律儀な奴だ。俺の国では、朝を大事にする者は信用された。お前もその類だろう。',
      '……眠そうだな。無理はするな。俺が見ている、それで十分だろう。'
    ]
  },
  day: {
    badge: '……調子はどうだ',
    lines: [
      '昼か。……お前は今、何をしている。別に気になったわけではないが。',
      '一日の真ん中だ。ここで気を抜くと、あとが辛い。俺の経験則だが、当たっていると思う。',
      '……腹は減っていないか。聞くだけ聞いておく。返事は期待していない。',
      '淡々と進めばいい。派手にやる必要は、どこにもない。'
    ]
  },
  evening: {
    badge: '……お疲れ様、希羽',
    lines: [
      '夕方か。……今日の分は、もう片付いたのか。',
      '一日の終わりが近い。俺の国では、この時間に一度、歩みを振り返る習わしがあった。',
      '……疲れているなら、無理に続けなくていい。俺はそれでも構わない。',
      '今日も、そこそこよくやったんじゃないか。……そこそこ、だからな。'
    ]
  },
  night: {
    badge: '……こんな時間まで',
    lines: [
      '夜更けだな。……根を詰めすぎるなよ、希羽。',
      '俺の世界では、夜は休むためにある。お前の世界の常識は知らんが、体は同じだろう。',
      '……眠れていないのか。理由は聞かない。ただ、無理はするな。',
      '静かな時間だ。……こういう時くらい、気を抜いてもいいと思うがな。'
    ]
  }
};
function getTimeSlot(hour){
  if(hour >= 5 && hour < 10) return 'morning';
  if(hour >= 10 && hour < 17) return 'day';
  if(hour >= 17 && hour < 21) return 'evening';
  return 'night';
}
function showLoginGreeting(){
  const data = TIME_GREETINGS[getTimeSlot(new Date().getHours())];
  const line = data.lines[Math.floor(Math.random()*data.lines.length)];
  queueModal({ badge: data.badge, big: null, msg: line });
}

let modalQueue = [];
function queueModal(m){
  modalQueue.push(m);
  if(modalQueue.length === 1) presentNextModal();
}
function presentNextModal(){
  const overlay = document.getElementById('levelup-overlay');
  if(modalQueue.length === 0){ overlay.style.display = 'none'; return; }
  const m = modalQueue[0];
  document.getElementById('levelup-badge').textContent = m.badge;
  const numEl = document.getElementById('levelup-num');
  if(m.big){ numEl.textContent = m.big; numEl.style.display = 'block'; }
  else { numEl.style.display = 'none'; }
  document.getElementById('levelup-msg').textContent = m.msg;
  overlay.style.display = 'flex';
}
document.getElementById('levelup-close').addEventListener('click', ()=>{
  modalQueue.shift();
  presentNextModal();
});

function grantLoginBonusIfNeeded(){
  const today = todayStr();
  if(state.lastLoginBonusDate === today) return;
  const oldLevel = levelFromXp(state.xp).level;
  const base = xpForLevel(oldLevel);
  const bonus = Math.round(base * LOGIN_BONUS_RATE);
  state.xp += bonus;
  state.lastLoginBonusDate = today;
  showToast('🎁 ログインボーナス +' + bonus + ' XP');
  const newLevel = levelFromXp(state.xp).level;
  if(newLevel > oldLevel) showLevelUp(newLevel);
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  if(!state.streak) state.streak = { count:0, lastDate:null };
  if(!state.todayEarnedDate) state.todayEarnedDate = null;
  if(typeof state.todayEarnedXp !== 'number') state.todayEarnedXp = 0;
  if(!state.lastClearBonusDate) state.lastClearBonusDate = null;
  if(!state.lastLoginBonusDate) state.lastLoginBonusDate = null;
  showLoginGreeting();
  grantLoginBonusIfNeeded();
  render();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ t.style.display='none'; }, 2600);
}

function render(){
  const {level, into, need} = levelFromXp(state.xp);
  document.getElementById('lvl-num').textContent = level;
  document.getElementById('xp-fill').style.width = Math.round((into/need)*100) + '%';
  document.getElementById('xp-cur').textContent = into + ' / ' + need + ' XP';
  document.getElementById('xp-next').textContent = 'レベル ' + (level+1) + ' まで ' + (need-into) + ' XP';

  const streakRow = document.getElementById('streak-row');
  const sc = state.streak ? state.streak.count : 0;
  if(sc > 0){
    streakRow.textContent = '🔥 連続 ' + sc + '日目・ボーナス +' + bonusRateForStreak(sc) + '%';
  } else {
    streakRow.textContent = '';
  }

  const list = document.getElementById('task-list');
  const active = state.tasks.filter(t=>!t.done);
  const done = state.tasks.filter(t=>t.done);
  const ordered = [...active, ...done];
  if(ordered.length===0){
    list.innerHTML = '<div class="empty">まだクエストがありません。下から追加しましょう。</div>';
  } else {
    list.innerHTML = ordered.map(t=>{
      const shownXp = t.done ? (t.earnedXp ?? t.xp) : t.xp;
      const metaText = t.done
        ? ('完了済み' + (t.bonusApplied ? ' ・連続ボーナス+' + t.bonusApplied + '%' : ''))
        : ('未完了' + (t.streakEnabled ? ' ・連続ボーナス対象' : ''));
      return `
      <div class="card ${t.done?'done':''}">
        <button class="check-btn" data-id="${t.id}" data-action="toggle">${t.done?'✓':''}</button>
        <div class="card-body">
          <div class="card-title">${escapeHtml(t.title)}${t.streakEnabled ? '<span class="streak-flag">🔥</span>' : ''}</div>
          <div class="card-meta">${metaText}</div>
        </div>
        <div class="xp-tag">+${shownXp} XP</div>
        <button class="del-btn" data-id="${t.id}" data-action="delete">×</button>
      </div>
    `;
    }).join('');
  }

  const rlist = document.getElementById('reward-list');
  if(state.rewards.length===0){
    rlist.innerHTML = '<div class="empty">まだごほうびが登録されていません。下から追加しましょう。</div>';
  } else {
    const sorted = [...state.rewards].sort((a,b)=>a.levelRequired-b.levelRequired);
    rlist.innerHTML = sorted.map(r=>{
      const unlocked = level >= r.levelRequired;
      return `
      <div class="reward-card ${unlocked?'':'locked'}">
        <div class="reward-icon">${unlocked ? '★' : '🔒'}</div>
        <div class="reward-body">
          <div class="reward-title">${escapeHtml(r.title)}</div>
          <div class="reward-meta">必要レベル ${r.levelRequired}${unlocked ? '・解放済み' : ''}</div>
        </div>
        <button class="claim-btn ${r.claimed?'claimed':''}" data-id="${r.id}" data-action="claim" ${unlocked?'':'disabled'}>${r.claimed ? '受け取り済み' : '受け取る'}</button>
      </div>`;
    }).join('');
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + '-section').classList.add('active');
  });
});

document.getElementById('add-task-btn').addEventListener('click', ()=>{
  const titleEl = document.getElementById('task-title');
  const err = document.getElementById('task-err');
  const title = titleEl.value.trim();
  if(!title){ err.style.display='block'; return; }
  err.style.display='none';
  const xp = parseInt(document.getElementById('task-xp').value, 10);
  const streakEnabled = document.getElementById('task-streak').checked;
  state.tasks.unshift({ id: 't'+Date.now(), title, xp, done:false, streakEnabled, earnedXp:null, bonusApplied:0 });
  titleEl.value='';
  document.getElementById('task-streak').checked = false;
  render();
  save();
});

document.getElementById('add-reward-btn').addEventListener('click', async ()=>{
  const titleEl = document.getElementById('reward-title');
  const lvlEl = document.getElementById('reward-lvl');
  const err = document.getElementById('reward-err');
  const title = titleEl.value.trim();
  const lvl = parseInt(lvlEl.value, 10);
  if(!title || !lvl || lvl < 1){ err.style.display='block'; return; }
  err.style.display='none';
  state.rewards.push({ id:'r'+Date.now(), title, levelRequired: lvl, claimed:false });
  titleEl.value=''; lvlEl.value='';
  render();
  await save();
});

document.getElementById('task-list').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  const task = state.tasks.find(t=>t.id===id);
  if(!task) return;
  if(btn.dataset.action==='toggle'){
    const wasDone = task.done;
    task.done = !task.done;
    if(!wasDone && task.done){
      const oldLevel = levelFromXp(state.xp).level;
      let bonusPct = 0;
      if(task.streakEnabled){
        bumpStreak();
        bonusPct = bonusRateForStreak(state.streak.count);
      }
      const bonusXp = Math.round(task.xp * bonusPct / 100);
      const earned = task.xp + bonusXp;
      task.earnedXp = earned;
      task.bonusApplied = bonusPct;
      state.xp += earned;

      const today = todayStr();
      if(state.todayEarnedDate !== today){ state.todayEarnedDate = today; state.todayEarnedXp = 0; }
      state.todayEarnedXp += earned;

      let toastMsg = bonusPct > 0
        ? '+' + earned + ' XP 獲得！(連続ボーナス+' + bonusPct + '%)'
        : '+' + earned + ' XP 獲得！';

      const activeCount = state.tasks.filter(t=>!t.done).length;
      if(activeCount === 0 && state.lastClearBonusDate !== today && state.todayEarnedXp > 0){
        const clearBonus = Math.round(state.todayEarnedXp * CLEAR_BONUS_RATE);
        if(clearBonus > 0){
          state.xp += clearBonus;
          state.lastClearBonusDate = today;
          toastMsg += ' ／ 全クリアボーナス +' + clearBonus + ' XP！';
        }
      }
      showToast(toastMsg);

      const newLevel = levelFromXp(state.xp).level;
      if(newLevel > oldLevel) showLevelUp(newLevel);
    } else if(wasDone && !task.done){
      state.xp = Math.max(0, state.xp - (task.earnedXp ?? task.xp));
      task.earnedXp = null;
      task.bonusApplied = 0;
    }
  } else if(btn.dataset.action==='delete'){
    if(task.done) state.xp = Math.max(0, state.xp - (task.earnedXp ?? task.xp));
    state.tasks = state.tasks.filter(t=>t.id!==id);
  }
  render();
  save();
});

document.getElementById('reward-list').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action="claim"]');
  if(!btn || btn.disabled) return;
  const id = btn.dataset.id;
  const reward = state.rewards.find(r=>r.id===id);
  if(!reward) return;
  reward.claimed = !reward.claimed;
  render();
  await save();
});

document.getElementById('backup-open-btn').addEventListener('click', ()=>{
  document.getElementById('backup-export').value = JSON.stringify(state, null, 2);
  document.getElementById('backup-import').value = '';
  document.getElementById('backup-err').style.display = 'none';
  document.getElementById('backup-overlay').style.display = 'flex';
});
document.getElementById('backup-close-btn').addEventListener('click', ()=>{
  document.getElementById('backup-overlay').style.display = 'none';
});
document.getElementById('backup-copy-btn').addEventListener('click', async ()=>{
  const ta = document.getElementById('backup-export');
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  try{
    await navigator.clipboard.writeText(ta.value);
    showToast('コピーしました');
  }catch(e){
    try{
      document.execCommand('copy');
      showToast('コピーしました');
    }catch(e2){
      showToast('自動コピーに失敗しました。手動で選択してコピーしてください');
    }
  }
});
document.getElementById('backup-restore-btn').addEventListener('click', ()=>{
  const raw = document.getElementById('backup-import').value.trim();
  const err = document.getElementById('backup-err');
  if(!raw){
    err.textContent = 'テキストを貼り付けてください';
    err.style.display = 'block';
    return;
  }
  let parsed;
  try{
    parsed = JSON.parse(raw);
  }catch(e){
    err.textContent = '正しいデータ形式ではありません(JSONとして読み込めませんでした)';
    err.style.display = 'block';
    return;
  }
  if(typeof parsed.xp !== 'number' || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.rewards)){
    err.textContent = 'クエストログのデータ形式ではないようです';
    err.style.display = 'block';
    return;
  }
  if(!confirm('現在のデータを上書きして復元します。よろしいですか？')) return;
  state = parsed;
  if(!state.streak) state.streak = { count:0, lastDate:null };
  if(!state.todayEarnedDate) state.todayEarnedDate = null;
  if(typeof state.todayEarnedXp !== 'number') state.todayEarnedXp = 0;
  if(!state.lastClearBonusDate) state.lastClearBonusDate = null;
  if(!state.lastLoginBonusDate) state.lastLoginBonusDate = null;
  err.style.display = 'none';
  save();
  render();
  document.getElementById('backup-overlay').style.display = 'none';
  showToast('データを復元しました');
});

load();
</script>
</body>
</html>
