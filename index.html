  background-repeat:no-repeat, no-repeat;
  background-position:left bottom, left top;
  background-size:340px auto, 100% 100%;
  background-attachment:fixed, scroll;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:2rem;
}
.wrap{max-width:480px;margin:0 auto;padding:1.25rem 1.1rem 0;}
h1,h2{font-family:'Inter',sans-serif;font-weight:700;margin:0;}
.hud{
  background:rgba(255,255,255,.82);
  border:2px solid var(--teal);
  border-radius:10px;
  padding:1.1rem 1.2rem;
  margin-bottom:1.1rem;
}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.7rem;}
.hud-top h1{font-size:1.35rem;color:var(--ink);}
.lvl-badge{
  font-family:'Staatliches',sans-serif;font-weight:400;font-size:2rem;letter-spacing:.02em;
  color:var(--teal);
}
.lvl-badge span{font-size:.72rem;font-family:'Inter',sans-serif;font-weight:600;color:var(--parchment-dim);display:block;text-align:right;margin-bottom:-2px;letter-spacing:.02em;}
.xp-track{
  background:#fff;
  border-radius:999px;
  height:10px;
  overflow:hidden;
  border:1.5px solid var(--teal);
}
.xp-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold-bright) 100%);
  border-radius:999px;
  transition:width .5s ease;
}
.xp-label{
  display:flex;justify-content:space-between;
  font-size:.78rem;color:var(--parchment-dim);margin-top:.4rem;
}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;}
.tab-btn{
  flex:1;padding:.6rem 0;text-align:center;
  background:rgba(255,255,255,.75);border:1.5px solid var(--teal);border-radius:8px;
  color:var(--parchment-dim);font-size:.9rem;font-weight:500;
  cursor:pointer;
}
.tab-btn.active{
  background:var(--gold);color:#fff;border-color:var(--gold);
}
.section{display:none;}
.section.active{display:block;}
.card{
  background:rgba(255,255,255,.88);
  color:var(--ink);
  border:1.5px solid var(--teal);
  border-radius:8px;
  padding:.85rem 1rem;
  margin-bottom:.65rem;
  display:flex;align-items:center;gap:.7rem;
}
.card.done{opacity:.55;}
.check-btn{
  width:26px;height:26px;flex:none;border-radius:50%;
  border:2px solid var(--teal);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--teal);font-size:.85rem;
}
.card.done .check-btn{background:var(--teal);color:var(--parchment);}
.card-body{flex:1;min-width:0;}
.card-title{font-weight:600;font-size:.95rem;text-decoration:none;}
.card.done .card-title{text-decoration:line-through;}
.card-meta{font-size:.78rem;color:var(--parchment-dim);margin-top:2px;}
.xp-tag{
  font-size:.75rem;font-weight:600;color:#1F6E63;
  background:#D3F1EC;padding:2px 8px;border-radius:999px;flex:none;
}
.del-btn{
  flex:none;background:none;border:none;color:#B0AFA0;cursor:pointer;
  font-size:1.1rem;padding:2px 4px;line-height:1;
}

<script>
const STORAGE_KEY = 'quest-log-state';
let state = { xp: 0, tasks: [], rewards: [], streak: { count: 0, lastDate: null }, history: [] };

function xpForLevel(n){ return 100 + (n-1)*40; }
function levelFromXp(xp){
  let lvl=1, remaining=xp;
  while(remaining >= xpForLevel(lvl)){
    remaining -= xpForLevel(lvl);
    lvl++;
  }
  return {level:lvl, into:remaining, need:xpForLevel(lvl)};
}

function todayStr(){ return localDateStr(new Date()); }
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return localDateStr(d);
}
function localDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}
function bonusRateForStreak(count){
  const capped = Math.min(count, 7);
  return Math.round((capped/7)*50); // 0〜50(%)、7日目で最大
}
const CLEAR_BONUS_RATE = 0.20; // タスク全クリアボーナス: 本日獲得XPの20%
const LOGIN_BONUS_RATE = 0.10; // ログインボーナス: 現レベルの必要XPの10%

function isTaskDoneToday(t){
  return t.recurrence === 'daily' ? (t.lastDoneDate === todayStr()) : !!t.done;
}
function isTaskVisibleToday(t){
  if(t.scheduledDate && t.scheduledDate > todayStr()) return false;
  return true;
}
function migrateState(){
  if(!state.streak) state.streak = { count:0, lastDate:null };
  if(!state.todayEarnedDate) state.todayEarnedDate = null;
  if(typeof state.todayEarnedXp !== 'number') state.todayEarnedXp = 0;
  if(!state.lastClearBonusDate) state.lastClearBonusDate = null;
  if(!state.lastLoginBonusDate) state.lastLoginBonusDate = null;
  if(!state.lastSeasonGreetingDate) state.lastSeasonGreetingDate = null;
  if(!Array.isArray(state.history)) state.history = [];
  if(!Array.isArray(state.tasks)) state.tasks = [];
  state.tasks.forEach(t=>{
    if(!t.recurrence){
      if(t.streakEnabled){
        t.recurrence = 'daily';
        t.lastDoneDate = t.done ? todayStr() : null;
      } else {
        t.recurrence = 'once';
      }
    }
    if(t.scheduledDate === undefined) t.scheduledDate = null;
    if(t.lastDoneDate === undefined) t.lastDoneDate = null;
    if(t.completedDate === undefined) t.completedDate = null;
  });
}
function purgeOldOnceTasks(){
  const today = todayStr();
  state.tasks = state.tasks.filter(t=>{
    if(t.recurrence === 'once' && t.done && t.completedDate && t.completedDate !== today){
      return false;
    }
    return true;
  });
}
function bumpStreak(){
  if(!state.streak) state.streak = { count:0, lastDate:null };
  const today = todayStr();
  if(state.streak.lastDate === today) return;
  state.streak.count = (state.streak.lastDate === yesterdayStr()) ? state.streak.count + 1 : 1;
  state.streak.lastDate = today;
}

function getSeason(month){
  if(month >= 3 && month <= 5) return 'spring';
  if(month >= 6 && month <= 8) return 'summer';
  if(month >= 9 && month <= 11) return 'autumn';
  return 'winter';
}

function showLoginGreeting(){
  const now = new Date();
  const today = todayStr();
  const timeData = TIME_GREETINGS[getTimeSlot(now.getHours())];
  let pool = timeData.lines;
  if(state.lastSeasonGreetingDate !== today){
    pool = pool.concat(SEASON_LINES[getSeason(now.getMonth()+1)]);
    state.lastSeasonGreetingDate = today;
  }
  const line = pool[Math.floor(Math.random()*pool.length)];
  queueModal({ badge: timeData.badge, big: null, msg: line });
}

let modalQueue = [];
function queueModal(m){
  modalQueue.push(m);
  if(modalQueue.length === 1) presentNextModal();
}
function presentNextModal(){
  const overlay = document.getElementById('levelup-overlay');
  if(modalQueue.length === 0){ overlay.style.display = 'none'; return; }
  const m = modalQueue[0];
  document.getElementById('levelup-badge').textContent = m.badge;
  const numEl = document.getElementById('levelup-num');
  if(m.big){ numEl.textContent = m.big; numEl.style.display = 'block'; }
  else { numEl.style.display = 'none'; }
  document.getElementById('levelup-msg').textContent = m.msg;
  overlay.style.display = 'flex';
}
document.getElementById('levelup-close').addEventListener('click', ()=>{
  modalQueue.shift();
  presentNextModal();
});

function grantLoginBonusIfNeeded(){
  const today = todayStr();
  if(state.lastLoginBonusDate === today) return;
  const oldLevel = levelFromXp(state.xp).level;
  const base = xpForLevel(oldLevel);
  const bonus = Math.round(base * LOGIN_BONUS_RATE);
  state.xp += bonus;
  state.lastLoginBonusDate = today;
  showToast('🎁 ログインボーナス +' + bonus + ' XP');
  const newLevel = levelFromXp(state.xp).level;
  if(newLevel > oldLevel) showLevelUp(newLevel);
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  migrateState();
  purgeOldOnceTasks();
  showLoginGreeting();
  grantLoginBonusIfNeeded();
  render();
  save();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ t.style.display='none'; }, 2600);
}

function render(){
  const {level, into, need} = levelFromXp(state.xp);
  document.getElementById('lvl-num').textContent = level;
  document.getElementById('xp-fill').style.width = Math.round((into/need)*100) + '%';
  document.getElementById('xp-cur').textContent = into + ' / ' + need + ' XP';
  document.getElementById('xp-next').textContent = 'レベル ' + (level+1) + ' まで ' + (need-into) + ' XP';

  const streakRow = document.getElementById('streak-row');
  const sc = state.streak ? state.streak.count : 0;
  if(sc > 0){
    streakRow.textContent = '🔥 連続 ' + sc + '日目・ボーナス +' + bonusRateForStreak(sc) + '%';
  } else {
    streakRow.textContent = '';
  }

  const list = document.getElementById('task-list');
  const visible = state.tasks.filter(isTaskVisibleToday);
  const activeT = visible.filter(t=>!isTaskDoneToday(t));
  const doneT = visible.filter(t=>isTaskDoneToday(t));
  const ordered = [...activeT, ...doneT];
  if(ordered.length===0){
    list.innerHTML = '<div class="empty">まだクエストがありません。下から追加しましょう。</div>';
  } else {
    list.innerHTML = ordered.map(t=>{
      const done = isTaskDoneToday(t);
      const shownXp = done ? (t.earnedXp ?? t.xp) : t.xp;
      const badges = [];
      if(t.recurrence === 'daily') badges.push('<span class="tag-daily">毎日</span>');
      if(t.streakEnabled) badges.push('<span class="streak-flag">🔥</span>');
      if(t.scheduledDate) badges.push('<span class="tag-date">📅 ' + t.scheduledDate.slice(5) + '〜</span>');
      const metaText = done
        ? ('完了済み' + (t.bonusApplied ? ' ・連続ボーナス+' + t.bonusApplied + '%' : ''))
        : ('未完了' + (t.streakEnabled ? ' ・連続ボーナス対象' : ''));
      return `
      <div class="card ${done?'done':''}">
        <button class="check-btn" data-id="${t.id}" data-action="toggle">${done?'✓':''}</button>
        <div class="card-body">
          <div class="card-title">${escapeHtml(t.title)} ${badges.join(' ')}</div>
          <div class="card-meta">${metaText}</div>
        </div>
        <div class="xp-tag">+${shownXp} XP</div>
        <button class="del-btn" data-id="${t.id}" data-action="delete">×</button>
      </div>
    `;
    }).join('');
  }

  const rlist = document.getElementById('reward-list');
  if(state.rewards.length===0){
    rlist.innerHTML = '<div class="empty">まだごほうびが登録されていません。下から追加しましょう。</div>';
  } else {
    const sorted = [...state.rewards].sort((a,b)=>a.levelRequired-b.levelRequired);
    rlist.innerHTML = sorted.map(r=>{
      const unlocked = level >= r.levelRequired;
      return `
      <div class="reward-card ${unlocked?'':'locked'}">
        <div class="reward-icon">${unlocked ? '★' : '🔒'}</div>
        <div class="reward-body">
          <div class="reward-title">${escapeHtml(r.title)}</div>
          <div class="reward-meta">必要レベル ${r.levelRequired}${unlocked ? '・解放済み' : ''}</div>
        </div>
        <button class="claim-btn ${r.claimed?'claimed':''}" data-id="${r.id}" data-action="claim" ${unlocked?'':'disabled'}>${r.claimed ? '受け取り済み' : '受け取る'}</button>
      </div>`;
    }).join('');
  }

  renderCalendar();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let calViewDate = new Date();
let calSelectedDate = todayStr();

function renderCalendar(){
  const y = calViewDate.getFullYear();
  const m = calViewDate.getMonth();
  document.getElementById('cal-title').textContent = y + '年' + (m+1) + '月';

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const today = todayStr();

  const cells = [];
  for(let i=0; i<firstDay; i++){
    cells.push({ dateStr:null, label: daysInPrevMonth - firstDay + 1 + i, otherMonth:true });
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    cells.push({ dateStr, label:d, otherMonth:false });
  }
  let trail = 1;
  while(cells.length % 7 !== 0){ cells.push({ dateStr:null, label: trail++, otherMonth:true }); }

  document.getElementById('cal-grid').innerHTML = cells.map(c=>{
    if(c.otherMonth) return '<div class="cal-cell other-month">' + c.label + '</div>';
    const hasHistory = state.history.some(h=>h.date === c.dateStr);
    const scheduledCount = state.tasks.filter(t=>t.scheduledDate === c.dateStr && !isTaskDoneToday(t)).length;
    const classes = ['cal-cell'];
    if(c.dateStr === today) classes.push('today');
    if(scheduledCount > 0) classes.push('has-schedule');
    if(c.dateStr === calSelectedDate) classes.push('selected');
    return '<div class="' + classes.join(' ') + '" data-date="' + c.dateStr + '">' + c.label
      + (scheduledCount>0 ? '<span class="cal-badge">'+scheduledCount+'</span>' : '')
      + (hasHistory ? '<span class="cal-dot"></span>' : '')
      + '</div>';
  }).join('');

  renderCalendarDetail();
}

function renderCalendarDetail(){
  const detail = document.getElementById('cal-detail');
  const dateStr = calSelectedDate;
  if(!dateStr){ detail.innerHTML = ''; return; }
  const parts = dateStr.split('-');
  const dateLabel = parts[1] + '月' + parts[2] + '日';

  const scheduled = state.tasks.filter(t=>t.scheduledDate === dateStr);
  const historyItems = state.history.filter(h=>h.date === dateStr);

  let html = '<h3>' + dateLabel + '</h3>';
  if(scheduled.length === 0 && historyItems.length === 0){
    html += '<div class="cal-detail-empty">この日には予定も記録もありません。</div>';
  } else {
    scheduled.forEach(t=>{
      html += '<div class="cal-detail-item"><span>📅 ' + escapeHtml(t.title) + '</span><span class="cal-item-right">+' + t.xp + ' XP<button class="cal-del-btn" data-id="' + t.id + '" data-action="delete-scheduled">×</button></span></div>';
    });
    historyItems.forEach(h=>{
      html += '<div class="cal-detail-item"><span>✓ ' + escapeHtml(h.title) + '</span><span>+' + h.xp + ' XP</span></div>';
    });
  }
  detail.innerHTML = html;
}

document.getElementById('cal-prev').addEventListener('click', ()=>{
  calViewDate.setMonth(calViewDate.getMonth()-1);
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', ()=>{
  calViewDate.setMonth(calViewDate.getMonth()+1);
  renderCalendar();
});
document.getElementById('cal-grid').addEventListener('click', (e)=>{
  const cell = e.target.closest('.cal-cell[data-date]');
  if(!cell || !cell.dataset.date) return;
  calSelectedDate = cell.dataset.date;
  renderCalendar();
});

document.getElementById('cal-detail').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-action="delete-scheduled"]');
  if(!btn) return;
  const id = btn.dataset.id;
  const task = state.tasks.find(t=>t.id===id);
  if(!task) return;
  if(isTaskDoneToday(task)) state.xp = Math.max(0, state.xp - (task.earnedXp ?? 0));
  state.tasks = state.tasks.filter(t=>t.id!==id);
  render();
  save();
});

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + '-section').classList.add('active');
  });
});

document.getElementById('task-streak').addEventListener('change', (e)=>{
  const dailyBox = document.getElementById('task-daily');
  if(e.target.checked){
    dailyBox.checked = true;
    dailyBox.disabled = true;
  } else {
    dailyBox.disabled = false;
  }
});

document.getElementById('add-task-btn').addEventListener('click', ()=>{
  const titleEl = document.getElementById('task-title');
  const err = document.getElementById('task-err');
  const title = titleEl.value.trim();
  if(!title){ err.style.display='block'; return; }
  err.style.display='none';
  const xp = parseInt(document.getElementById('task-xp').value, 10);
  const daily = document.getElementById('task-daily').checked;
  const streakEnabled = document.getElementById('task-streak').checked;
  const dateVal = document.getElementById('task-date').value;
  state.tasks.unshift({
    id: 't'+Date.now(),
    title, xp,
    recurrence: daily ? 'daily' : 'once',
    streakEnabled: daily && streakEnabled,
    scheduledDate: dateVal || null,
    done: false,
    lastDoneDate: null,
    earnedXp: null,
    bonusApplied: 0
  });
  titleEl.value='';
  document.getElementById('task-daily').checked = false;
  document.getElementById('task-daily').disabled = false;
  document.getElementById('task-streak').checked = false;
  document.getElementById('task-date').value = '';
  render();
  save();
});

document.getElementById('add-reward-btn').addEventListener('click', async ()=>{
  const titleEl = document.getElementById('reward-title');
  const lvlEl = document.getElementById('reward-lvl');
  const err = document.getElementById('reward-err');
  const title = titleEl.value.trim();
  const lvl = parseInt(lvlEl.value, 10);
  if(!title || !lvl || lvl < 1){ err.style.display='block'; return; }
  err.style.display='none';
  state.rewards.push({ id:'r'+Date.now(), title, levelRequired: lvl, claimed:false });
  titleEl.value=''; lvlEl.value='';
  render();
  await save();
});

function completeTask(task){
  const oldLevel = levelFromXp(state.xp).level;
  let bonusPct = 0;
  if(task.recurrence === 'daily' && task.streakEnabled){
    bumpStreak();
    bonusPct = bonusRateForStreak(state.streak.count);
  }
  const bonusXp = Math.round(task.xp * bonusPct / 100);
  const earned = task.xp + bonusXp;
  task.earnedXp = earned;
  task.bonusApplied = bonusPct;
  state.xp += earned;

  const today = todayStr();
  if(task.recurrence === 'daily'){ task.lastDoneDate = today; } else { task.done = true; task.completedDate = today; }

  if(state.todayEarnedDate !== today){ state.todayEarnedDate = today; state.todayEarnedXp = 0; }
  state.todayEarnedXp += earned;
  state.history.push({ date: today, taskId: task.id, title: task.title, xp: earned });

  let toastMsg = bonusPct > 0
    ? '+' + earned + ' XP 獲得！(連続ボーナス+' + bonusPct + '%)'
    : '+' + earned + ' XP 獲得！';

  const activeCount = state.tasks.filter(t => isTaskVisibleToday(t) && !isTaskDoneToday(t)).length;
  if(activeCount === 0 && state.lastClearBonusDate !== today && state.todayEarnedXp > 0){
    const clearBonus = Math.round(state.todayEarnedXp * CLEAR_BONUS_RATE);
    if(clearBonus > 0){
      state.xp += clearBonus;
      state.lastClearBonusDate = today;
      toastMsg += ' ／ 全クリアボーナス +' + clearBonus + ' XP！';
    }
  }
  showToast(toastMsg);

  const newLevel = levelFromXp(state.xp).level;
  if(newLevel > oldLevel) showLevelUp(newLevel);
}

function uncompleteTask(task){
  state.xp = Math.max(0, state.xp - (task.earnedXp ?? 0));
  const today = todayStr();
  if(task.recurrence === 'daily'){ task.lastDoneDate = null; } else { task.done = false; task.completedDate = null; }
  task.earnedXp = null;
  task.bonusApplied = 0;
  for(let i = state.history.length - 1; i >= 0; i--){
    if(state.history[i].taskId === task.id && state.history[i].date === today){
      state.history.splice(i, 1);
      break;
    }
  }
}

document.getElementById('task-list').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  const task = state.tasks.find(t=>t.id===id);
  if(!task) return;
  if(btn.dataset.action==='toggle'){
    if(isTaskDoneToday(task)) uncompleteTask(task); else completeTask(task);
  } else if(btn.dataset.action==='delete'){
    if(isTaskDoneToday(task)) state.xp = Math.max(0, state.xp - (task.earnedXp ?? 0));
    state.tasks = state.tasks.filter(t=>t.id!==id);
  }
  render();
  save();
});

document.getElementById('reward-list').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action="claim"]');
  if(!btn || btn.disabled) return;
  const id = btn.dataset.id;
  const reward = state.rewards.find(r=>r.id===id);
  if(!reward) return;
  reward.claimed = !reward.claimed;
  render();
  await save();
});

document.getElementById('backup-open-btn').addEventListener('click', ()=>{
  document.getElementById('backup-import').value = '';
  document.getElementById('backup-err').style.display = 'none';
  document.getElementById('backup-overlay').style.display = 'flex';
});
document.getElementById('backup-close-btn').addEventListener('click', ()=>{
  document.getElementById('backup-overlay').style.display = 'none';
});
document.getElementById('backup-copy-quick-btn').addEventListener('click', async ()=>{
  const text = JSON.stringify(state, null, 2);
  try{
    await navigator.clipboard.writeText(text);
    showToast('📋 コピーしました。メモなどに保存しておいてください');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      document.execCommand('copy');
      showToast('📋 コピーしました。メモなどに保存しておいてください');
    }catch(e2){
      showToast('自動コピーに失敗しました');
    }
    document.body.removeChild(ta);
  }
});
document.getElementById('backup-restore-btn').addEventListener('click', ()=>{
  const raw = document.getElementById('backup-import').value.trim();
  const err = document.getElementById('backup-err');
  if(!raw){
    err.textContent = 'テキストを貼り付けてください';
    err.style.display = 'block';
    return;
  }
  let parsed;
  try{
    parsed = JSON.parse(raw);
  }catch(e){
    err.textContent = '正しいデータ形式ではありません(JSONとして読み込めませんでした)';
    err.style.display = 'block';
    return;
  }
  if(typeof parsed.xp !== 'number' || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.rewards)){
    err.textContent = 'クエストログのデータ形式ではないようです';
    err.style.display = 'block';
    return;
  }
  if(!confirm('現在のデータを上書きして復元します。よろしいですか？')) return;
  state = parsed;
  migrateState();
  err.style.display = 'none';
  save();
  render();
  document.getElementById('backup-overlay').style.display = 'none';
  showToast('データを復元しました');
});

load();
</script>
